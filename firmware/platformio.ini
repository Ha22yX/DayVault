[platformio]
default_envs = dayvault

[env:dayvault]
platform = ststm32
board = dayvault_l452rc
framework = stm32cube

build_type = release
monitor_speed = 115200

build_flags =
    -DUSE_USBD_COMPOSITE
    -DUSBD_CMPSIT_ACTIVATE_CDC=1
    -DUSBD_CMPSIT_ACTIVATE_MSC=1

[env:native]
platform = native
test_framework = unity
lib_ignore = FatFs
test_build_src = true
build_src_filter =
    -<*>
    +<timeutil.c>
    +<ringbuf.c>
    +<wav.c>
    +<adpcm.c>
    +<segmgr.c>
    +<power_state.c>
    +<eventlog.c>
    +<usbproto.c>
