[platformio]
default_envs = dayvault

[env:dayvault]
platform = ststm32
board = dayvault_l452rc
framework = arduino
board_build.flash_size = 256KB
board_build.ldscript = boards/stm32l452rc.ld
build_type = release
monitor_speed = 115200
build_flags =
    -Os
    -std=gnu++11
    -DARDUINO_GENERIC_L452RCTX
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DHAL_DFSDM_MODULE_ENABLED
    -DUSB_CDC_TRANSMIT_TIMEOUT=10000

















[env:native]
platform = native
test_framework = unity
build_src_filter =
    -<*>
    +<RingBuf.cpp>
    +<WavFile.cpp>
    +<Cmd.cpp>
    +<Recorder.cpp>
test_build_src = true
