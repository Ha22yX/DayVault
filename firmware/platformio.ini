[platformio]
default_envs = dayvault

[env:dayvault]
platform = ststm32
board = dayvault_l452rc
framework = arduino
board_build.flash_size = 256KB
board_build.ldscript = boards/stm32l452rc.ld
build_type = release
monitor_speed = 115200
build_flags =
    -Os
    -std=gnu++11
    -DARDUINO_GENERIC_L452RCTX
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DHAL_DFSDM_MODULE_ENABLED
    -DUSB_CDC_TRANSMIT_TIMEOUT=10000
    -DCDC_TRANSMIT_QUEUE_BUFFER_PACKET_NUMBER=32
lib_deps =
    DayVaultOpus
lib_ldf_mode = deep+

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++11
build_src_filter =
    -<*>
    +<RingBuf.cpp>
    +<WavFile.cpp>
    +<Crc32.cpp>
    +<SdProtocol.cpp>
    +<ExportProtocol.cpp>
    +<WinUsbDescriptors.cpp>
    +<Cmd.cpp>
    +<Recorder.cpp>
    +<AudioFusion.cpp>
    +<NoiseReduction.cpp>
    +<SpeechLeveler.cpp>
    +<OpusArena.cpp>
    +<OggOpusWriter.cpp>
    +<TransferBuffer.cpp>
test_build_src = true
