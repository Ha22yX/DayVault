    <text x="872" y="269" fill="#173B32" font-size="19" font-weight="750">AUDIO TO TEXT</text>
    <text x="872" y="296" fill="#65766F" font-size="12">searchable, off-device</text>
  </g>

  <path d="M838 262 H849" stroke="#268E83" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="68" y="382" fill="#51645D" font-family="Inter, Arial, sans-serif" font-size="12">LOCAL-FIRST RECORDING  /  DOCUMENTED HARDWARE  /  MEASURE BEFORE CLAIMING</text>
