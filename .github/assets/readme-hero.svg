<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">DayVault hardware overview</title>
  <desc id="desc">A compact overview of dual PDM capture, STM32L452 control, microSD storage, USB-C export, and audio-to-text archival.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#173B32" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#268E83" />
    </marker>
  </defs>

  <rect width="1120" height="420" rx="28" fill="#F4F7F4" />
  <path d="M0 318 C210 252 322 374 528 324 C744 270 866 300 1120 214 L1120 420 L0 420 Z" fill="#DCEDE5" />
  <path d="M868 0 A252 252 0 0 1 1120 252 L1120 0 Z" fill="#EEE4D4" />

  <g filter="url(#shadow)">
    <rect x="68" y="58" width="984" height="284" rx="18" fill="#FFFFFF" />
  </g>

  <rect x="90" y="80" width="330" height="240" rx="14" fill="#173B32" />
  <circle cx="136" cy="127" r="25" fill="#E7F3ED" />
  <rect x="129" y="111" width="14" height="24" rx="7" fill="#173B32" />
