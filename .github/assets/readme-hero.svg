  <text x="112" y="184" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="750">DayVault</text>
  <text x="112" y="212" fill="#C6DED5" font-family="Inter, Arial, sans-serif" font-size="16">Wearable voice logger</text>
  <rect x="112" y="236" width="158" height="30" rx="15" fill="#EDE3D1" />
  <text x="132" y="256" fill="#493D2B" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1">DESIGN SNAPSHOT</text>
  <circle cx="116" cy="293" r="4" fill="#E7B85C" />
  <text x="130" y="298" fill="#C6DED5" font-family="Inter, Arial, sans-serif" font-size="12">Engineering review in progress</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="448" y="80" width="184" height="108" rx="12" fill="#F1F7F4" stroke="#D9E9E1" />
    <text x="468" y="108" fill="#65766F" font-size="10" font-weight="700" letter-spacing="1.4">CAPTURE</text>
    <text x="468" y="142" fill="#173B32" font-size="23" font-weight="750">2x PDM</text>
    <text x="468" y="166" fill="#65766F" font-size="12">digital microphones</text>

    <rect x="650" y="80" width="184" height="108" rx="12" fill="#F7F3EC" stroke="#E9DFD0" />
    <text x="670" y="108" fill="#7A7062" font-size="10" font-weight="700" letter-spacing="1.4">STORE</text>
    <text x="670" y="142" fill="#3F382E" font-size="23" font-weight="750">microSD</text>
    <text x="670" y="166" fill="#7A7062" font-size="12">local audio files</text>

    <rect x="852" y="80" width="184" height="108" rx="12" fill="#F2F0F8" stroke="#E2DDF0" />
